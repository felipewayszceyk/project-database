{% extends "base.html" %}

{% block title %} Add New Client {% endblock %}

{% block content %}

<section class="page-header">
    <h1>Add Client ✉️</h1>
    <p>Register a new client for consultancy</p>
</section>

<section class="contact-section">

    {% if success %}
    <div class="alert success">
        {{ success }}
    </div>
    {% endif %}

    {% if error %}
    <div class="alert error">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('new_client') }}">
        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" placeholder="Joao Gomes">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="joao@example.com">
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
             <input type="text" id="phone" name="phone" placeholder="+00 00 00000-000">
        </div>

        <div class="form-group">
            <label for="country_of_origin">Country of Origin</label>
             <input type="text" id="country_of_origin" name="country_of_origin" placeholder= "Brazil">
        </div>
        
        <button type="submit" class="btn">Save Client</button>
    </form>

</section>

{% endblock %}
